# Each claim in README.md (and reports) with its evidence. Checked by tools/check_claims.py.
# kind run_mean  : mean over run records in runs/ (legacy imports from tools/import_legacy.py) of per-case soft regret
# kind file_value: a number in a stored JSON result file
# kind none      : no machine-checkable source yet -> listed as UNBACKED (see REFACTOR_STATUS.md)
scan:
  - file: README.md
    from: "## Results at a glance"
    ignore_contexts: ["Gemma 2", "9B", "\\b2 coins\\b", "offer 2"]      # model names and a price, not results
claims:
  - id: plain-fails-share
    file: README.md
    text: "Not optimal in 55% of decisions"
    numbers:
      - {shown: "55%", evidence: {kind: file_value, path: demo_out/failure_map.json, sha256: 90ef5eaadda56e4c05a0f612c78abc5d74386a218187d84c8324a0ec0d7d65c7, key: share_nonzero_hard_regret, scale: 100, }}
  - id: plain-slope
    file: README.md
    text: "its offer moves 0.12 coins per coin of stated cost (should be 1)"
    numbers:
      - {shown: "0.12", evidence: {kind: file_value, path: demo/step2.json, sha256: ba5b7ae0217ee7118bec2453ab99918c7b06e6476b4ee81f85418bfef773325a, key: "regression.cost below resale.slope_cost"}}
      - {shown: "1", evidence: {kind: definition, reason: "the ideal slope is one-for-one by the payoff rule: a seller who states cost C accepts any offer >= C, so the best offer rises 1 for 1 with C (harness/protected/payoffs/haggling.py)"}}
  - id: sentence-heldout
    file: README.md
    text: "Held-out loss 0.58 → 0.17"
    numbers:
      - {shown: "0.58", evidence: {kind: file_value, path: demo_out/lora_baselines.json, sha256: 62a567161ab8fe2139d612a8f5f4c49ef53975080139eb037711a6d371029b8b, key: "lora_tune.plain.soft_regret"}}
      - {shown: "0.17", evidence: {kind: file_value, path: demo_out/lora_baselines.json, sha256: 62a567161ab8fe2139d612a8f5f4c49ef53975080139eb037711a6d371029b8b, key: "lora_tune.method text.soft_regret"}}
  - id: steering-coherent
    file: README.md
    text: "Best coherent move about 0.2 coins"
    numbers:
      - {shown: "0.2", evidence: {kind: file_value, path: demo_out/steer_checks.json, sha256: a9100deaf974932dde9aca37a948f0d25e9bb318ef6a20fa4046ccc75879d215, key: "b.1.d_expected", scale: -1}}
  - id: lora-test-lora
    file: README.md
    text: "Locked test: 0.26, same as the sentence in the prompt (0.26); plain 0.53"
    numbers:
      - {shown: "0.26", evidence: {kind: run_mean, task: haggling, model: gemma2_9b, solver: "legacy:oldtest:method_lora_3seed_mean_probs", split: old_test, n_records: 1}}
      - {shown: "0.53", evidence: {kind: run_mean, task: haggling, model: gemma2_9b, solver: "legacy:oldtest:plain", split: old_test, n_records: 1}}
  - id: lora-test-sentence
    file: README.md
    text: "same as the sentence in the prompt (0.26)"
    numbers:
      - {shown: "0.26", evidence: {kind: run_mean, task: haggling, model: gemma2_9b, solver: "legacy:oldtest:method_text_in_prompt", split: old_test, n_records: 1}}
  - id: lesson-tune
    file: README.md
    text: "Tuning: 0.38 vs plain 0.66"
    numbers:
      - {shown: "0.38", evidence: {kind: run_mean, task: haggling, model: gemma2_9b, solver: "legacy:teacher", split: tune, n_records: 3}}
      - {shown: "0.66", evidence: {kind: run_mean, task: haggling, model: gemma2_9b, solver: "legacy:plain", split: tune, n_records: 1}}
  - id: examples-same
    file: README.md
    text: "same-range 0.04 (plain 0.69)"
    numbers:
      - {shown: "0.04", evidence: {kind: run_mean, task: haggling, model: gemma2_9b, solver: "legacy:claude_examples", split: test_same, n_records: 3}}
      - {shown: "0.69", evidence: {kind: run_mean, task: haggling, model: gemma2_9b, solver: "legacy:plain", split: test_same, n_records: 1}}
  - id: examples-hard
    file: README.md
    text: "harder 0.17 (plain 1.30)"
    numbers:
      - {shown: "0.17", evidence: {kind: run_mean, task: haggling, model: gemma2_9b, solver: "legacy:claude_examples", split: test_hard, n_records: 3}}
      - {shown: "1.30", evidence: {kind: run_mean, task: haggling, model: gemma2_9b, solver: "legacy:plain", split: test_hard, n_records: 1}}
  - id: say-agreement
    file: README.md
    text: "Written offer agrees with its own pick on about a third of cases"
    qualitative: true
    numbers: []
  # ---- LLAMA_RESULTS.md (branch llama; tune only; Llama numbers from harness run records)
  - id: llama-plain-tune
    file: LLAMA_RESULTS.md
    text: "Plain Llama scores 1.18 on tune against 0.214 for the model-free stated-cost rule; the below-cost type is worst at 1.83. Gemma's plain score on the same cells was 0.66"
    numbers:
      - {shown: "1.18", evidence: {kind: run_mean, task: haggling, model: llama31_8b, solver: plain, split: tune, n_records: 1}}
      - {shown: "0.214", evidence: {kind: run_mean, task: haggling, model: null, solver: "baseline:stated_cost_rule", split: tune, n_records: 1}}
      - {shown: "1.83", evidence: {kind: run_mean, task: haggling, model: llama31_8b, solver: plain, split: tune, type: below, n_records: 1}}
      - {shown: "0.66", evidence: {kind: run_mean, task: haggling, model: gemma2_9b, solver: "legacy:plain", split: tune, n_records: 1}}
  - id: llama-prompt-arms
    file: LLAMA_RESULTS.md
    text: "Our method paragraph 0.77, Claude's lesson 0.93, neutral text 1.16, wrong rule 0.61."
    numbers:
      - {shown: "0.77", evidence: {kind: run_mean, task: haggling, model: llama31_8b, solver: "notes:method_original", split: tune, n_records: 1}}
      - {shown: "0.93", evidence: {kind: run_mean, task: haggling, model: llama31_8b, solver: "notes:teacher", split: tune, n_records: 1}}
      - {shown: "1.16", evidence: {kind: run_mean, task: haggling, model: llama31_8b, solver: "notes:neutral", split: tune, n_records: 1}}
      - {shown: "0.61", evidence: {kind: run_mean, task: haggling, model: llama31_8b, solver: "notes:wrong_rule", split: tune, n_records: 1}}
  - id: llama-lora-examples
    file: LLAMA_RESULTS.md
    text: "Examples-100 (3 seeds at the chosen learning rate) averages 0.048 (Gemma 0.032); examples-25 (one seed) 0.086. Controls: cheapest-label N=100 0.43, scrambled answers N=100 0.66."
    numbers:
      - {shown: "3", evidence: {kind: definition, reason: "three seeds were run (LLAMA_PLAN.md); n_records 3 is pinned on the next entry"}}
      - {shown: "0.048", evidence: {kind: run_mean, task: haggling, model: llama31_8b, solver: "lora:claude_examples_n100_lr1e-04", split: tune, n_records: 3}}
      - {shown: "0.032", evidence: {kind: run_mean, task: haggling, model: gemma2_9b, solver: "legacy:claude_examples", split: tune, n_records: 3}}
      - {shown: "0.086", evidence: {kind: run_mean, task: haggling, model: llama31_8b, solver: "lora:claude_examples_n25_lr1e-04", split: tune, n_records: 1}}
      - {shown: "100", evidence: {kind: definition, reason: "training set size N (number of worked-example cells)"}}
      - {shown: "25", evidence: {kind: definition, reason: "training set size N"}}
      - {shown: "0.43", evidence: {kind: run_mean, task: haggling, model: llama31_8b, solver: "lora:cheapest_label_n100_lr1e-04", split: tune, n_records: 1}}
      - {shown: "0.66", evidence: {kind: run_mean, task: haggling, model: llama31_8b, solver: "lora:shuffled_claude_n100_lr1e-04", split: tune, n_records: 1}}
  - id: llama-planted-nocost
    file: LLAMA_RESULTS.md
    text: "(mass on the expected option 0.40, 0.13 and 0.36 for seeds 0-2, against a 0.9 bar)"
    numbers:
      - {shown: "0.40", evidence: {kind: file_value, path: demo_out/llama_report.json, sha256: 657f9eef93a84a9304e6f5954e3db6ddb32c435ab9f88a190bdaed87107f1431, key: "R3_planted_mass.0.planted-nocost"}}
      - {shown: "0.13", evidence: {kind: file_value, path: demo_out/llama_report.json, sha256: 657f9eef93a84a9304e6f5954e3db6ddb32c435ab9f88a190bdaed87107f1431, key: "R3_planted_mass.1.planted-nocost"}}
      - {shown: "0.36", evidence: {kind: file_value, path: demo_out/llama_report.json, sha256: 657f9eef93a84a9304e6f5954e3db6ddb32c435ab9f88a190bdaed87107f1431, key: "R3_planted_mass.2.planted-nocost"}}
      - {shown: "0", evidence: {kind: definition, reason: "seed label"}}
      - {shown: "2", evidence: {kind: definition, reason: "seed label"}}
      - {shown: "0.9", evidence: {kind: definition, reason: "planted pass bar PLANTED_MIN_MASS in harness/evaluate.py"}}
  - id: llama-readout-limitation
    file: LLAMA_RESULTS.md
    text: "they agree with Llama's own free answer on about half the probe prompts"
    qualitative: true
    numbers: []
